<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Resolution Logo Display</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0; /* Light background for contrast */
        }
        img {
            max-width: 90vw; /* Occupy most of the viewport width */
            max-height: 90vh; /* Occupy most of the viewport height */
            width: auto;
            height: auto;
        }
    </style>
</head>
<body>
    <img src="src/assets/LOGO.webp" alt="Company Logo">
</body>
</html>
